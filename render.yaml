{
  "services": [
    {
      "type": "web",
      "runtime": "node",
      "name": "fixit-web",
      "repo": "https://github.com/n25101882-svg/FixIT",
      "branch": "release/v1.0.0",
      "region": "frankfurt",
      "plan": "free",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --include=dev && npm run deploy:build:api",
      "startCommand": "npm run deploy:start",
      "healthCheckPath": "/health/ready",
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "24.22.1"
        },
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "HOST",
          "value": "0.0.0.0"
        },
        {
          "key": "TRUST_PROXY_HOPS",
          "value": "1"
        },
        {
          "key": "JWT_TTL_SECONDS",
          "value": "900"
        },
        {
          "key": "JWT_SECRET",
          "generateValue": true
        },
        {
          "key": "CORS_ORIGINS",
          "sync": false
        },
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "fixit-postgres",
            "property": "connectionString"
          }
        },
        {
          "key": "SERVE_FRONTEND",
          "value": "1"
        },
        {
          "key": "VITE_API_URL",
          "value": "/api/v1"
        }
      ]
    }
  ],
  "databases": [
    {
      "name": "fixit-postgres",
      "databaseName": "fixit",
      "user": "fixit",
      "region": "frankfurt",
      "plan": "free",
      "postgresMajorVersion": "18",
      "ipAllowList": []
    }
  ]
}
